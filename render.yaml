services:
  - type: web
    name: hospital-blood-report-analyzer
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py collectstatic --no-input && python manage.py migrate --no-input && gunicorn config.wsgi:application --log-file - --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: REQUIRE_POSTGRES
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Optional override; config.settings uses RENDER_EXTERNAL_URL when unset.
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ai-hackathon-sept-2026.onrender.com"
      - key: WEB_CONCURRENCY
        value: 4
      - key: HEALTHZ_RUN_MIGRATIONS
        value: "false"
      - key: SEED_DEMO_USERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-blood-report-db
          property: connectionString

databases:
  - name: hospital-blood-report-db
    plan: free
